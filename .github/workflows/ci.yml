name: ci

# proj1102 CI - static validation only, no AWS calls. We do not deploy from CI;
# each component is deployed locally by its own deploy.sh.
#
# What this workflow checks:
#   1. Every Python file in the repo compiles (`python -m py_compile`).
#   2. Every Bash deploy.sh has valid shell syntax (`bash -n`).
#   3. Every Step Functions ASL definition is valid JSON.
#   4. The top-level README exists and isn't empty.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all Python sources
        run: |
          set -e
          mapfile -t files < <(find . -path './.git' -prune -o -name '*.py' -print | grep -v '/\.venv/' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python files found"; exit 0
          fi
          echo "Compiling ${#files[@]} Python files..."
          python -m py_compile "${files[@]}"

      - name: Bash syntax check on deploy scripts
        run: |
          set -e
          shopt -s globstar nullglob
          fail=0
          for f in **/deploy*.sh; do
            echo "$f"
            bash -n "$f" || fail=1
          done
          if [ "$fail" = "1" ]; then exit 1; fi

      - name: Validate Step Functions ASL JSON
        run: |
          set -e
          for f in stepfunctions/*.asl.json; do
            echo "$f"
            python -c "import json,sys; json.load(open('$f')); print('  OK')"
          done

      - name: Verify README exists
        run: |
          test -s README.md || (echo "README.md missing or empty"; exit 1)
          echo "README present."

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # The Lambda modules import boto3 / pandas / pyarrow at the top
          # level - even pure-helper tests need those to be importable.
          # In production these come from the Lambda runtime + AWS-managed
          # pandas layer; for unit-test collection we install them directly.
          pip install pytest "boto3>=1.34" "pandas>=2.0" "pyarrow>=15.0"

      - name: Run unit tests
        run: pytest -ra tests/

      - name: Build housekeeping Docker image
        run: docker build -t proj1102-housekeeping-ci -f housekeeping/Dockerfile .
