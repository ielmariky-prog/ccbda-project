# proj1102 - project metadata, pytest config, and dev dependencies.
# Not packaged as a wheel; each Lambda is deployed by its own deploy.sh.

[project]
name = "proj1102"
version = "1.0.0"
description = "Near real-time financial forecasting on AWS - proj1102 CCBDA-MIRI 2026"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Ralph Khairallah"},
    {name = "Ilias El Mariky"},
    {name = "Dalibor Svonavec"},
    {name = "Francesco Barillari"},
    {name = "Arthur Bohin"},
]

[project.optional-dependencies]
# Local development + CI. Not bundled into any Lambda zip.
dev = [
    "pytest>=8.0",
    "boto3>=1.34",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
